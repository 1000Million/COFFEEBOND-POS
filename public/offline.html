<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5c4033" />
    <title>Coffee Bond POS · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f9f5f0; color: #2d2019; font-family: system-ui, sans-serif; }
      main { width: min(100%, 440px); border: 1px solid #e7ddd3; border-radius: 16px; background: #fff; padding: 28px; text-align: center; box-shadow: 0 12px 40px rgba(45, 32, 25, 0.08); }
      img { width: 72px; height: 72px; object-fit: contain; }
      h1 { margin: 18px 0 8px; font-size: 24px; }
      p { margin: 0; color: #6b5c54; line-height: 1.55; }
      button { min-height: 44px; margin-top: 22px; border: 0; border-radius: 12px; background: #4a3026; color: #fff; padding: 0 20px; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="Coffee Bond" />
      <h1>You're offline</h1>
      <p>Reconnect before taking payments, completing orders, changing KOTs, or updating stock.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
